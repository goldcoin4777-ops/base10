<body class="text-white">
<div id="app" class="mx-auto max-w-[420px] h-[100dvh] sm:h-[880px] sm:my-4 flex flex-col bg-slate-900 sm:rounded-[2rem] sm:border-2 sm:border-slate-700 overflow-hidden relative">
  <header id="top" class="px-5 pt-5 pb-3 border-b border-slate-800"></header>
  <main id="screen" class="flex-1 overflow-y-auto px-5 pt-4 pb-28"></main>
  <nav id="nav" class="absolute bottom-0 inset-x-0 bg-slate-950 border-t border-slate-700 grid grid-cols-5"></nav>
</div>
<div id="land" class="hidden fixed inset-0 z-50 bg-black overflow-hidden"></div>
<script>
/* ===== Configuración ===== */
const CFG={PREC:.9,TIME:3,DAYS:3,N_REPASO:10,WARM_SECS:45,N_SORO:5,N_REAL:3,N_ANZAN:3};
/* Pistas del soroban: niveles por dígitos (t = segundos máximos promedio por reto) */
const SUM_LV=[{l:'1 dígito',t:6,d:1},{l:'2 dígitos',t:10,d:2},{l:'3 dígitos',t:15,d:3},{l:'4 dígitos',t:20,d:4}];
const TRACKS={
  suma:{name:'Suma',ic:'plus',need:1,levels:SUM_LV},
  resta:{name:'Resta',ic:'minus',need:2,levels:SUM_LV},
  mixto:{name:'Mixto: sumas y restas',ic:'arrow-up-down',need:2,levels:[{l:'1 dígito',t:10,d:1},{l:'2 dígitos',t:16,d:2},{l:'3 dígitos',t:24,d:3},{l:'4 dígitos',t:32,d:4}]},
  mult:{name:'Multiplicación',ic:'x',need:3,levels:[{l:'1 × 1',t:8,a:1,b:1},{l:'2 × 1',t:15,a:2,b:1},{l:'3 × 1',t:20,a:3,b:1},{l:'2 × 2',t:30,a:2,b:2}]},
  div:{name:'División',ic:'divide',need:4,levels:[{l:'2 ÷ 1',t:10,a:2,b:1},{l:'3 ÷ 1',t:20,a:3,b:1},{l:'3 ÷ 2',t:30,a:3,b:2}]}
};
const LEVELS=[
  {n:1,name:'Sumas',ops:['+']},
  {n:2,name:'Sumas y restas',ops:['+','−']},
  {n:3,name:'+ Multiplicación',ops:['+','−','×']},
  {n:4,name:'Las cuatro operaciones',ops:['+','−','×','÷']}
];
const STRATS={
  '+':['Completar el 10','Lo sabía de memoria','Conté','Otra forma'],
  '−':['Bajar al 10','Pensé en la suma inversa','Lo sabía de memoria','Conté'],
  '×':['Atajo del 10 (×10 y ajustar)','Mitad de ×10 (para ×5)','Dobles','Lo sabía de memoria'],
  '÷':['Duplicar y dividir entre 10','Pensé en la multiplicación','Lo sabía de memoria','Otra forma']
};
const OPNAME={'+':'Suma','−':'Resta','×':'Multiplicación','÷':'División'};

/* ===== Estado persistente ===== */
const KEY='base10-app-v1';
const DEF=()=>({level:1,qualify:0,lastQualifyDate:null,testMode:true,sessions:[],bank:{},strategies:{},studyDays:[],formDone:{},soroTrack:'suma',soro:Object.fromEntries(Object.keys(TRACKS).map(k=>[k,{lv:1,q:0,last:null}]))});
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=Object.assign(DEF(),JSON.parse(r)),d=DEF();for(const k in d.soro)if(!s.soro[k])s.soro[k]=d.soro[k];return s;}}catch(e){}return DEF();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ===== Utilidades ===== */
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>fmt(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return fmt(d);};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function studyStreak(){const set=new Set(S.studyDays);const d=new Date();if(!set.has(fmt(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(fmt(d))){n++;d.setDate(d.getDate()-1);}return n;}
const card=(h,c='bg-slate-800')=>`<div class="rounded-3xl ${c} p-5 mb-4">${h}</div>`;

/* ===== Generador de ejercicios ===== */
function gen(op){
  let a,b,ans;
  if(op==='+'){
    if(Math.random()<.6){a=rnd(2,9);b=rnd(Math.max(2,11-a),9);}
    else{a=rnd(1,8)*10+rnd(2,9);b=rnd(Math.max(2,11-a%10),9);}
    ans=a+b;
  }else if(op==='−'){
    if(Math.random()<.6){a=rnd(11,18);b=rnd(a%10+1,9);}
    else{a=rnd(2,9)*10+rnd(1,8);b=rnd(a%10+1,9);}
    ans=a-b;
  }else if(op==='×'){a=rnd(2,9);b=rnd(2,9);ans=a*b;}
  else{b=rnd(2,9);ans=rnd(2,9);a=b*ans;}
  return {a,b,op,ans,key:a+op+b};
}

/* ===== "¿Cómo se piensa?" ===== */
function hint(e){
  const {a,b,op}=e;
  if(op==='+'){
    const u=a%10,need=10-u,t=a+need;
    if(u&&b===need)return [`${b} es justo lo que le falta a ${a} para llegar a ${t}.`,`${a} + ${b} = ${t}`];
    if(u&&b>need)return [`A ${a} le faltan ${need} para llegar a ${t}.`,`Tomas ${need} del ${b}: te quedan ${b-need}.`,`${t} + ${b-need} = ${a+b}`];
    return [`${a} + ${b} = ${a+b}`];
  }
  if(op==='−'){
    const u=a%10;
    if(u&&b>u)return [`Primero quitas ${u} para bajar a ${a-u}.`,`Te faltan por quitar ${b-u}.`,`${a-u} − ${b-u} = ${a-b}`];
    return [`${a} − ${b} = ${a-b}`];
  }
  if(op==='×'){
    const big=Math.max(a,b),small=Math.min(a,b);
    if(small===5||big===5){const o=small===5?big:small;return [`${o} × 10 = ${o*10}`,`× 5 es la mitad de × 10.`,`La mitad de ${o*10} es ${o*5}`];}
    if(small===2)return [`× 2 es el doble.`,`${big} + ${big} = ${big*2}`];
    if(big>=6)return [`Piensa en ${small} × 10 = ${small*10}.`,`Pero son ${big} veces, no 10: sobran ${10-big} × ${small} = ${small*(10-big)}.`,`${small*10} − ${small*(10-big)} = ${a*b}`];
    if(big===4)return [`× 4 es el doble del doble.`,`Doble de ${small}: ${small*2}`,`Doble de ${small*2}: ${small*4}`];
    return [`${big} × ${small} = ${Array(small).fill(big).join(' + ')} = ${a*b}`];
  }
  if(b===5)return [`Duplicas los dos números: ${a} × 2 = ${a*2} y 5 × 2 = 10.`,`${a*2} ÷ 10 = ${a/5} (quitas el cero).`];
  if(b===2)return [`÷ 2 es sacar la mitad.`,`La mitad de ${a} es ${a/2}`];
  return [`Pregúntate: ¿qué número por ${b} da ${a}?`,`${b} × ${a/b} = ${a}`,`Entonces ${a} ÷ ${b} = ${a/b}`];
}
const hintBox=(steps,e)=>`<div class="pop rounded-2xl bg-sky-950 border-2 border-sky-500 p-4 mb-3"><div class="flex items-center gap-2 text-xl font-bold text-sky-200 mb-2"><i data-lucide="lightbulb" class="w-6 h-6"></i>Así se piensa</div>${e?pict(e):''}<ol class="space-y-1">${steps.map((s,i)=>`<li class="text-xl text-white"><span class="font-bold text-sky-300">${i+1}.</span> ${s}</li>`).join('')}</ol></div>`;

/* ===== Banco de errores ===== */
function updBank(e,mastered){
  const k=e.key,b=S.bank[k];
  if(mastered){if(b){b.w--;if(b.w<=0)delete S.bank[k];}}
  else S.bank[k]={a:e.a,b:e.b,op:e.op,ans:e.ans,key:k,w:Math.min(3,(b?b.w:0)+1)};
  save();
}

/* ===== Nivel y medición ===== */
function evaluate(acc,avg){
  const ok=acc>=CFG.PREC&&avg<CFG.TIME;let unlocked=false;const d=today();
  if(ok){
    if(S.testMode)S.qualify++;
    else if(S.lastQualifyDate===d){}
    else if(S.lastQualifyDate===yesterday())S.qualify++;
    else S.qualify=1;
    S.lastQualifyDate=d;
    if(S.qualify>=CFG.DAYS&&S.level<4){S.level++;S.qualify=0;S.lastQualifyDate=null;unlocked=true;}
  }else{S.qualify=0;S.lastQualifyDate=null;}
  save();return {ok,unlocked};
}

/* ===== Retos del soroban por pista ===== */
const nd=d=>d===1?rnd(1,9):rnd(10**(d-1),10**d-1);
const nd2=d=>d===1?rnd(2,9):nd(d);
function genSoro(k,L){
  const d=L.d;
  if(k==='suma'){const a=nd(d),b=nd(d);return {a,b,op:'+',ans:a+b,text:`${a} + ${b}`};}
  if(k==='resta'){let a=nd(d),b=nd(d);while(a===b)b=nd(d);if(b>a)[a,b]=[b,a];return {a,b,op:'−',ans:a-b,text:`${a} − ${b}`};}
  if(k==='mixto'){
    const lo=d===1?1:10**(d-1);let t=nd(d);const terms=[{s:'',n:t}];
    for(const s of (Math.random()<.5?['+','−']:['−','+'])){let n;if(s==='+'){n=nd(d);t+=n;}else{n=rnd(lo,Math.min(10**d-1,t));t-=n;}terms.push({s,n});}
    return {terms,ans:t,text:terms.map((x,i)=>i?`${x.s} ${x.n}`:x.n).join(' ')};
  }
  if(k==='mult'){const a=nd2(L.a),b=nd2(L.b);return {a,b,op:'×',ans:a*b,text:`${a} × ${b}`};}
  let b,qmin,qmax;
  do{b=nd2(L.b);qmin=Math.max(2,Math.ceil(10**(L.a-1)/b));qmax=Math.floor((10**L.a-1)/b);}while(qmin>qmax);
  const q=rnd(qmin,qmax);return {a:b*q,b,op:'÷',ans:q,text:`${b*q} ÷ ${b}`};
}
const places=n=>String(n).split('').map((c,i,arr)=>+c*10**(arr.length-1-i)).filter(x=>x>0);
function soroHint(e){
  if(e.terms){let t=e.terms[0].n;const out=[`Coloca el ${t}.`];for(const x of e.terms.slice(1)){const nt=x.s==='+'?t+x.n:t-x.n;out.push(`${x.s==='+'?'Suma':'Resta'} ${x.n}: ${t} ${x.s} ${x.n} = ${nt}`);t=nt;}return out;}
  if(e.op==='+'||e.op==='−'){
    if(e.a<10&&e.b<10)return hint(e);
    let t=e.a;const out=[`Coloca el ${e.a}. Luego ${e.op==='+'?'suma':'resta'} ${e.b} por columnas, de izquierda a derecha:`];
    for(const p of places(e.b)){const nt=e.op==='+'?t+p:t-p;out.push(`${t} ${e.op} ${p} = ${nt}`);t=nt;}return out;
  }
  if(e.op==='×'){
    if(e.a<10&&e.b<10)return hint(e);
    const big=e.b>=10?e.b:e.a,other=e.b>=10?e.a:e.b,ps=places(big),pr=ps.map(p=>p*other);
    return [`Separa ${big} por posiciones: ${ps.join(' + ')}.`,...ps.map((p,i)=>`${p} × ${other} = ${pr[i]}`),`Suma: ${pr.join(' + ')} = ${e.ans}`];
  }
  if(e.a<100&&e.b<10)return hint(e);
  return [`¿Qué número por ${e.b} da ${e.a}?`,`${e.b} × ${e.ans} = ${e.a}`,`Entonces ${e.a} ÷ ${e.b} = ${e.ans}`];
}
function evalTrack(k,acc,avg){
  const T=TRACKS[k],P=S.soro[k],L=T.levels[P.lv-1],ok=acc>=CFG.PREC&&avg<L.t,d=today();let unlocked=false;
  if(ok){
    if(S.testMode)P.q++;else if(P.last===d){}else if(P.last===yesterday())P.q++;else P.q=1;
    P.last=d;if(P.q>=CFG.DAYS&&P.lv<T.levels.length){P.lv++;P.q=0;P.last=null;unlocked=true;}
  }else{P.q=0;P.last=null;}
  save();return {ok,unlocked};
}
const curTrack=()=>{const k=S.soroTrack;return TRACKS[k]&&TRACKS[k].need<=S.level&&S.formDone[TRACK_AREA[k]]?k:'suma';};
function startTrack(k){if(!S.formDone[TRACK_AREA[k]]){startForm(TRACK_AREA[k]);return;}S.soroTrack=k;save();startRun('soroban');}
function setTrackLv(k,n){const P=S.soro[k];P.lv=n;P.q=0;P.last=null;save();render();}

/* ===== Teclado numérico ===== */
let inp='';
const DISP='h-20 rounded-2xl bg-slate-950 border-2 border-slate-500 flex items-center justify-center text-5xl font-extrabold tracking-wider mb-3 transition-colors';
function padHTML(){
  const k=(l,fn,c='bg-slate-700')=>`<button class="key ${c} rounded-2xl h-16 text-3xl font-bold" onclick="${fn}">${l}</button>`;
  return `<div id="disp" class="${DISP}">${inp||'<span class="text-slate-400">?</span>'}</div>
  <div class="grid grid-cols-3 gap-2">${[1,2,3,4,5,6,7,8,9].map(n=>k(n,`press('${n}')`)).join('')}${k('<i data-lucide="delete" class="w-8 h-8 mx-auto"></i>','del()','bg-slate-800')}${k('0',"press('0')")}${k('OK','submitPad()','bg-emerald-600')}</div>`;
}
function updDisp(){const el=document.getElementById('disp');if(el)el.innerHTML=inp||'<span class="text-slate-400">?</span>';}
function press(d){if(inp.length<5){inp+=d;updDisp();}}
function del(){inp=inp.slice(0,-1);updDisp();}
function submitPad(){if(!inp||!run||!run.onSubmit)return;const v=parseInt(inp,10);inp='';run.onSubmit(v);}
function flash(ok){const el=document.getElementById('disp');if(!el)return;el.className=DISP.replace('bg-slate-950 border-slate-500',ok?'bg-emerald-900 border-emerald-400':'bg-rose-900 border-rose-400');}
function resetDisp(){const el=document.getElementById('disp');if(el){el.className=DISP;updDisp();}}
document.addEventListener('keydown',e=>{if(!document.getElementById('disp'))return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')del();else if(e.key==='Enter')submitPad();});

/* ===== Soroban ===== */
let rods=newRods(5),landscape=false,drag=null,landTimer=null,digitsOn=true,AC=null;
let soundOn=(()=>{try{return localStorage.getItem('b10-sound')!=='0';}catch(e){return true;}})();
const ORANGE='#ff6b00',FRAME='#3a3a3a';
function newRods(n){return Array.from({length:n},()=>({h:0,e:0}));}
function soroVal(){return rods.reduce((s,r,i)=>s+(r.h*5+r.e)*10**(rods.length-1-i),0);}
function setRodCount(n){if(rods.length===n)return;let x=soroVal();rods=newRods(n);for(let i=n-1;i>=0&&x>0;i--){const d=x%10;rods[i]={h:d>=5?1:0,e:d%5};x=Math.floor(x/10);}}
function resetRods(){rods=newRods(rods.length);}
function setH(i,v){if(rods[i].h===v)return;rods[i].h=v;clack(1);updAbacus();}
function setE(i,v){const d=Math.abs(rods[i].e-v);if(!d)return;rods[i].e=v;clack(d);updAbacus();}
function clearAbacus(){ensureAudio();const had=soroVal()>0;resetRods();if(had)clack(4);updAbacus();}
function updAbacus(){
  const el=document.getElementById('abacus');if(!el)return;const g=geo(el.dataset.mode);
  el.querySelectorAll('[data-bead]').forEach(b=>{const i=+b.dataset.i,k=+b.dataset.k,r=rods[i];if(!r)return;const h=b.dataset.bead==='h',on=h?r.h:(k<=r.e?1:0);b.style.transition='';b.style.background=beadBg(on);b.style.transform=`translate(-50%,${h?beadY(g,'h',0,r.h):beadY(g,'e',k,on?0:1)}px)`;});
  rods.forEach((r,i)=>{const d=document.getElementById('dg'+i);if(d)d.textContent=r.h*5+r.e;});
  const v=document.getElementById('sval');if(v)v.textContent=soroVal();
}

/* Sonido de choque de cuentas (sintetizado) */
function ensureAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function clack(n=1){
  if(!soundOn||!AC)return;
  try{
    const t=AC.currentTime,vol=Math.min(1,.55+.12*n),len=.045,buf=AC.createBuffer(1,Math.floor(AC.sampleRate*len),AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,7);
    const src=AC.createBufferSource();src.buffer=buf;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2300+Math.random()*700;bp.Q.value=2.5;const g=AC.createGain();g.gain.value=vol;
    src.connect(bp).connect(g).connect(AC.destination);src.start(t);
    const o=AC.createOscillator();o.type='triangle';o.frequency.setValueAtTime(1500+Math.random()*300,t);const og=AC.createGain();og.gain.setValueAtTime(.22*vol,t);og.gain.exponentialRampToValueAtTime(.001,t+.035);
    o.connect(og).connect(AC.destination);o.start(t);o.stop(t+.04);
  }catch(e){}
}
function toggleSound(){soundOn=!soundOn;try{localStorage.setItem('b10-sound',soundOn?'1':'0');}catch(e){}ensureAudio();clack(1);render();}
function toggleDigits(){digitsOn=!digitsOn;render();}

/* Geometría: vertical (p) u horizontal (l) */
function stageSize(){const vw=innerWidth,vh=innerHeight;return {W:Math.max(vw,vh),H:Math.min(vw,vh),rot:vh>vw};}
function geo(mode){
  if(mode!=='l')return {n:5,colW:70,bh:34,bw:62,dig:30,fr:14};
  const W=innerWidth,H=innerHeight,areaW=W-64-24,dig=digitsOn?Math.max(16,Math.min(26,Math.round(H*.055))):0;
  const bh=Math.max(22,Math.min(72,Math.floor((H-46-16-14-10-(dig?dig+8:0)-10)/7)-2));
  const n=Math.max(5,Math.min(9,Math.floor((areaW-20)/(bh*2.05))));
  const colW=Math.min(Math.floor((areaW-20)/n),Math.round(bh*2.4));
  return {n,colW,bh,bw:Math.min(colW-4,Math.round(bh*1.95)),dig,fr:8};
}
/* Posición vertical de cada cuenta. f: 0 = arriba, 1 = abajo (cielo: 1 = activa; tierra: 0 = activa) */
function beadY(g,kind,k,f){const slot=g.bh+2;if(kind==='h')return 2+f*slot;return 2*g.bh+6+14+2+(k-1)*slot+f*slot;}
const beadBg=on=>`linear-gradient(to bottom,${on?'#ff7a1a 0 50%,#e35a00 50% 100%':'#474747 0 50%,#393939 50% 100%'})`;
function abacusHTML(mode='p'){
  const g=geo(mode),n=rods.length,heavenH=2*g.bh+6,H=heavenH+14+5*(g.bh+2)+4;
  const bead=(kind,i,k,on,y)=>`<div data-bead="${kind}" data-i="${i}" data-k="${k}" class="bead absolute left-1/2 top-0 z-10 cursor-pointer" style="width:${g.bw}px;height:${g.bh}px;clip-path:polygon(22% 0,78% 0,100% 50%,78% 100%,22% 100%,0 50%);background:${beadBg(on)};transform:translate(-50%,${y}px)"></div>`;
  const cols=rods.map((r,i)=>{
    let b=bead('h',i,0,r.h,beadY(g,'h',0,r.h));
    for(let k=1;k<=4;k++){const on=k<=r.e;b+=bead('e',i,k,on,beadY(g,'e',k,on?0:1));}
    return `<div class="relative" style="width:${g.colW}px;height:${H}px"><div class="absolute top-0 bottom-0 left-1/2 -translate-x-1/2" style="background:${FRAME};width:${Math.max(5,Math.round(g.bh/4))}px"></div>${b}</div>`;
  }).join('');
  const dots=rods.map((_,i)=>(n-1-i)%3===0?`<span class="absolute bg-gray-400" style="width:5px;height:5px;left:${4+(i+.5)*g.colW-2.5}px;top:4.5px"></span>`:'').join('');

}

/* Clic y arrastre de cuentas: la cuenta sigue el dedo, empuja a sus vecinas y al soltar se desliza a su lugar */
const rotatedNow=()=>false;
document.addEventListener('pointerdown',ev=>{
  const b=ev.target.closest('[data-bead]');if(!b)return;ev.preventDefault();ensureAudio();
  const ab=document.getElementById('abacus'),i=+b.dataset.i,k=+b.dataset.k,r=rods[i],h=b.dataset.bead==='h';
  drag={t:b.dataset.bead,i,k,x:ev.clientX,y:ev.clientY,moved:false,g:geo(ab.dataset.mode),f0:h?r.h:(k<=r.e?0:1),f:null,els:[...ab.querySelectorAll(`[data-bead][data-i="${i}"]`)]};
});
window.addEventListener('pointermove',ev=>{
  if(!drag)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y,ly=rotatedNow()?-dx:dy;
  if(!drag.moved&&Math.abs(ly)<4)return;drag.moved=true;
  const slot=drag.g.bh+2,r=rods[drag.i],f=Math.max(0,Math.min(1,drag.f0+ly/slot));drag.f=f;
  if(drag.t==='h'){const el=drag.els.find(e=>e.dataset.bead==='h');el.style.transition='none';el.style.transform=`translate(-50%,${beadY(drag.g,'h',0,f)}px)`;return;}
  drag.els.filter(e=>e.dataset.bead==='e').forEach(e=>{const j=+e.dataset.k;let fj=j<=r.e?0:1;fj=j<drag.k?Math.min(fj,f):j>drag.k?Math.max(fj,f):f;e.style.transition='none';e.style.transform=`translate(-50%,${beadY(drag.g,'e',j,fj)}px)`;});
});
window.addEventListener('pointerup',()=>{
  if(!drag)return;const d=drag;drag=null;const r=rods[d.i];
  if(!d.moved){if(d.t==='h')setH(d.i,r.h^1);else setE(d.i,d.k<=r.e?d.k-1:d.k);return;}
  const mv=d.f-d.f0,tgt=Math.abs(mv)>.3?(mv>0?1:0):d.f0;
  if(d.t==='h'){if(tgt!==r.h)setH(d.i,tgt);else updAbacus();return;}
  const ne=tgt===0?Math.max(r.e,d.k):Math.min(r.e,d.k-1);if(ne!==r.e)setE(d.i,ne);else updAbacus();
});
window.addEventListener('pointercancel',()=>{if(drag){drag=null;updAbacus();}});

/* ===== Cuadros: dibujo (pictórico) ===== */
function sqDiv(code,attrs='',s=26){
  const st=code==='t'?'background:#0f6e56;border:2px solid #1d9e75':code==='c'?'background:#993c1d;border:2px solid #d85a30':code==='x'?'background:transparent;border:2px dashed #d85a30':'background:transparent;border:2px dashed #475569';
  return `<div ${attrs} class="rounded-[5px] shrink-0" style="width:${s}px;height:${s}px;${st}"></div>`;
}
function pictCols(cols,s){return `<div class="flex justify-center items-end gap-[3px] my-3">${cols.map(c=>`<div class="flex flex-col-reverse gap-[2px]">${c.map(x=>sqDiv(x,'',s)).join('')}</div>`).join('')}</div>`;}
function pict(e){
  if(!e||e.terms)return '';
  const {a,b,op}=e,tens=n=>[...Array(Math.floor(n/10))].map(()=>Array(10).fill('t'));
  if(op==='+'){
    if(a+b>100)return '';const cols=tens(a),u=a%10;let rest=b;
    if(u){const add=Math.min(10-u,rest);cols.push([...Array(u).fill('t'),...Array(add).fill('c')]);rest-=add;}
    while(rest>0){const n=Math.min(10,rest);cols.push(Array(n).fill('c'));rest-=n;}
    return pictCols(cols,a+b<=20?18:12);
  }
  if(op==='−'){
    if(a>100)return '';const cols=tens(a);if(a%10)cols.push(Array(a%10).fill('t'));let r=b;
    for(let k=cols.length-1;k>=0&&r>0;k--)for(let j=cols[k].length-1;j>=0&&r>0;j--){cols[k][j]='x';r--;}
    return pictCols(cols,a<=20?18:12);
  }
  if(op==='×'){
    if(a>10||b>10)return '';const big=Math.max(a,b),small=Math.min(a,b);let cols;
    if(small!==2&&(big===5||small===5)){const o=small===5?big:small;cols=[...Array(10)].map((_,k)=>Array(o).fill(k<5?'t':'x'));}
    else if(small!==2&&big>=6)cols=[...Array(10)].map((_,k)=>Array(small).fill(k<big?'t':'x'));
    else cols=[...Array(big)].map(()=>Array(small).fill('t'));
    return pictCols(cols,16);
  }
  if(a>100||b>10)return '';
  return pictCols([...Array(a/b)].map(()=>Array(b).fill('t')),14);
}

/* ===== Sonidos de pegar / despegar ===== */
function nb(t,len,f,vol,q=1.2){const buf=AC.createBuffer(1,Math.floor(AC.sampleRate*len),AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);const s=AC.createBufferSource();s.buffer=buf;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=vol;s.connect(fl).connect(g).connect(AC.destination);s.start(t);}
function tone(t,f0,f1,len,vol,type='sine'){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+len);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+len+.02);}
function sndSnap(){if(!soundOn||!AC)return;try{const t=AC.currentTime;nb(t,.025,1200,.9);nb(t+.016,.03,2600,.7);nb(t+.034,.04,1800,.5);tone(t,170,70,.09,.5);}catch(e){}}
function sndUnsnap(){if(!soundOn||!AC)return;try{const t=AC.currentTime;tone(t,320,900,.07,.3);nb(t,.02,3000,.25,2);}catch(e){}}
function sndWin(){if(!soundOn||!AC)return;try{const t=AC.currentTime;[523,659,784].forEach((f,i)=>tone(t+i*.09,f,f,.18,.18,'triangle'));}catch(e){}}

/* ===== Formación con cuadros ===== */
const AREAS=['suma','resta','mult','div'],AREA_OF={'+':'suma','−':'resta','×':'mult','÷':'div'};

    tasks:[{t:'build',r:3,c:4},{t:'build',r:4,c:6},{t:'remove',r:6,c:10,target:9}]},

function fmInitTask(){
  const T=fmTask();fm.warn='';fm.phase='play';
  fm.st=T.t==='complete'?{A:Array(T.a).fill('t'),B:Array(T.b).fill('c')}
    :T.t==='down'?{ten:Array(10).fill('t'),loose:Array(T.a-10).fill('t'),trash:[]}

    :T.t==='remove'?{cols:[...Array(T.c)].map(()=>Array(T.r).fill('t')),trash:[]}

}

function fmIsDone(){const T=fmTask(),s=fm.st;return T.t==='complete'?s.A.length===10:T.t==='down'?s.trash.length===T.b:T.t==='build'?s.cols.length===T.c:T.t==='remove'?s.cols.length===T.target:s.pile.length===0;}
function fmAct(g,i,to,dragged){
  if(!fm||fm.phase!=='play')return;
  const T=fmTask(),s=fm.st;let res=null;
  if(T.t==='complete'){
    if(g==='B'&&(!dragged||to==='A')){if(s.A.length<10){s.A.push(s.B.pop());res='snap';}}
    else if(g==='A'&&(!dragged||to==='B')){if(s.A[s.A.length-1]==='c'){s.B.push(s.A.pop());res='pop';}else res=`Esos cuadros son del ${T.a}: mueve solo los del ${T.b}.`;}
  }else if(T.t==='down'){
    if((g==='ten'||g==='loose')&&(!dragged||to==='trash')){
      if(g==='ten'&&s.loose.length)res='Primero quita los sueltos: así bajas justo al 10.';
      else if(s.trash.length>=T.b)res=`Ya quitaste ${T.b}.`;
      else{(g==='ten'?s.ten:s.loose).pop();s.trash.push('c');res='pop';}
    }else if(g==='trash'&&(!dragged||to==='ten'||to==='loose')){s.trash.pop();if(s.loose.length||s.ten.length===10)s.loose.push('t');else s.ten.push('t');res='snap';}
  }else if(T.t==='build'){
    if(g==='disp'&&(!dragged||to==='rect')){if(s.cols.length<T.c){s.cols.push(Array(T.r).fill('t'));res='snap';}else res=`Ya tienes ${T.c} columnas.`;}

  }else if(T.t==='remove'){

    if(g==='pile'&&(!dragged||(to&&to.startsWith('col')))){const c=s.cols.find(x=>x.length<T.b);if(c){s.pile.pop();c.push('c');res='snap';}}

  }
  if(res==='snap')sndSnap();else if(res==='pop')sndUnsnap();
  fm.warn=(res&&res!=='snap'&&res!=='pop')?res:'';

  render();
}

  const btn=(t,fn,c='bg-amber-500 text-slate-950')=>`<button onclick="${fn}" class="w-full mt-3 rounded-2xl ${c} text-2xl font-extrabold py-4">${t}</button>`;
  if(fm.phase==='intro')return hdr+`<div class="pop rounded-3xl bg-slate-800 p-5"><div class="flex items-center gap-3 mb-3"><div class="w-12 h-12 rounded-2xl bg-[#0f6e56] border-2 border-[#1d9e75] flex items-center justify-center shrink-0"><i data-lucide="${F.ic}" class="w-7 h-7"></i></div><h2 class="text-3xl font-extrabold leading-tight">${F.title}</h2></div><ul class="space-y-3">${F.intro.map(x=>`<li class="text-xl text-white leading-relaxed">• ${x}</li>`).join('')}</ul>${pict(F.ex)}<div class="text-lg text-slate-100">Verde: lo que ya tienes. Naranja: lo que mueves o quitas.</div>${btn('Empezar','fmBegin()')}</div>`;
  if(fm.phase==='end'){const nx=pendingForm();return hdr+`<div class="pop rounded-3xl bg-emerald-950 border-2 border-emerald-400 p-6 text-center"><div class="text-5xl">🎉</div><h2 class="text-3xl font-extrabold mt-2">¡Formación completada!</h2><p class="text-xl text-white mt-3 leading-relaxed">Ya viste con tus manos por qué funciona. Ahora toca ganar velocidad con la práctica.</p>${nx?btn('Siguiente formación: '+FORM[nx].title,`startForm('${nx}')`):btn('Ir a practicar',"go('inicio')")}${btn('Ver formaciones',"go('lecciones')",'bg-slate-700 text-white')}</div>`;}
  const T=fmTask(),s=fm.st;
  let h=hdr+progBar(fm.ti,n)+`<p class="text-xl text-white mb-1 leading-snug">${fmInstr(T)}</p><div class="text-center text-4xl font-extrabold my-2">${fmLive(T,s)}</div><div class="rounded-3xl bg-slate-950 border border-slate-700 p-3 select-none" style="touch-action:none">${fmBoard(T,s)}</div>`;
  if(fm.warn)h+=`<div class="pop shake mt-3 rounded-2xl bg-amber-950 border-2 border-amber-500 p-3 text-lg font-semibold">${fm.warn}</div>`;
  if(fm.phase==='done')h+=`<div class="pop mt-3 rounded-3xl bg-emerald-950 border-2 border-emerald-400 p-4"><div class="text-xl text-white leading-relaxed">${fmMsg(T)}</div>${T.t==='build'?btn(s.rot?'Volver a girar':'Girar el rectángulo','fmRot()','bg-teal-600 text-white'):''}${btn(fm.ti+1<n?'Siguiente':'Terminar formación','fmNext()')}</div>`;
  else h+=`<button onclick="fmReset()" class="w-full mt-3 rounded-2xl bg-slate-700 py-3 text-xl font-bold flex items-center justify-center gap-2"><i data-lucide="rotate-ccw" class="w-6 h-6"></i>Reiniciar</button>`;
  return h;
}

let fdrag=null;
document.addEventListener('pointerdown',ev=>{const q=ev.target.closest('[data-sq]');if(!q||!fm)return;ev.preventDefault();ensureAudio();const r=q.getBoundingClientRect();fdrag={g:q.dataset.g,i:+q.dataset.i,x:ev.clientX,y:ev.clientY,ox:ev.clientX-r.left,oy:ev.clientY-r.top,src:q,ghost:null};});
window.addEventListener('pointermove',ev=>{
  if(!fdrag)return;
  if(!fdrag.ghost){if(Math.hypot(ev.clientX-fdrag.x,ev.clientY-fdrag.y)<6)return;const g=fdrag.src.cloneNode(true);g.removeAttribute('data-sq');g.style.position='fixed';g.style.pointerEvents='none';g.style.zIndex='60';g.style.transform='scale(1.12)';g.style.filter='drop-shadow(0 6px 10px rgba(0,0,0,.6))';document.body.appendChild(g);fdrag.ghost=g;fdrag.src.style.opacity='.25';}
  fdrag.ghost.style.left=(ev.clientX-fdrag.ox)+'px';fdrag.ghost.style.top=(ev.clientY-fdrag.oy)+'px';
});
window.addEventListener('pointerup',ev=>{
  if(!fdrag)return;const d=fdrag;fdrag=null;
  if(d.ghost){d.ghost.remove();d.src.style.opacity='';const el=document.elementFromPoint(ev.clientX,ev.clientY),z=el&&el.closest('[data-drop]');fmAct(d.g,d.i,z?z.dataset.drop:null,true);}
  else fmAct(d.g,d.i,null,false);
});
window.addEventListener('pointercancel',()=>{if(fdrag&&fdrag.ghost)fdrag.ghost.remove();if(fdrag)fdrag.src.style.opacity='';fdrag=null;});

function render(){

    <button onclick="toggleTest()" class="w-full flex items-center justify-between rounded-2xl bg-slate-700 px-4 py-3 text-xl font-semibold mb-2"><span>Modo prueba</span><span class="rounded-full px-3 py-1 text-lg font-bold ${S.testMode?'bg-amber-500 text-slate-950':'bg-slate-500'}">${S.testMode?'Activado':'Apagado'}</span></button>
    <div class="text-lg text-slate-100 mb-3">${S.testMode?'Cada sesión cuenta como un día, para probar los desbloqueos rápido.':'Solo cuentan días distintos y seguidos.'}</div>
    ${S.testMode?`<div class="text-lg font-semibold mb-2">Saltar a nivel:</div><div class="grid grid-cols-4 gap-2 mb-3">${[1,2,3,4].map(n=>`<button onclick="setLevel(${n})" class="rounded-xl py-3 text-xl font-bold ${S.level===n?'bg-amber-500 text-slate-950':'bg-slate-700'}">${n}</button>`).join('')}</div>`:''}
    <div class="grid grid-cols-2 gap-2 mb-3"><button onclick="S.formDone={suma:true,resta:true,mult:true,div:true};save();render()" class="rounded-xl bg-slate-700 py-3 text-base font-bold">Formaciones: marcar hechas</button><button onclick="S.formDone={};save();render()" class="rounded-xl bg-slate-700 py-3 text-base font-bold">Formaciones: reiniciar</button></div>
    <button onclick="resetAll()" class="w-full rounded-2xl ${resetArm?'bg-rose-600':'bg-slate-700'} py-3 text-xl font-bold">${resetArm?'Toca otra vez para confirmar':'Reiniciar todo el progreso'}</button>`)}`;
}
function toggleTest(){S.testMode=!S.testMode;S.qualify=0;S.lastQualifyDate=null;save();render();}
function setLevel(n){S.level=n;S.qualify=0;S.lastQualifyDate=null;save();render();}
function resetAll(){if(!resetArm){resetArm=true;render();setTimeout(()=>{resetArm=false;if(tab==='progreso'&&!run)render();},4000);return;}resetArm=false;const t=S.testMode;S=DEF();S.testMode=t;save();render();}

/* ===== Motor de sesiones ===== */
const INFO={
  warm:{t:'Calentamiento',i:'flame',d:`${CFG.WARM_SECS} segundos de parejas del 10: ¿cuánto le falta a cada número para llegar a 10?`},
  repaso:{t:'Repaso diario',i:'repeat',d:`${CFG.N_REPASO} ejercicios. Piensa con el 10. De vez en cuando te preguntaré cómo lo resolviste.`},
  soroban:{t:'Soroban',i:'calculator',d:`${CFG.N_SORO} retos: resuelve la operación moviendo las cuentas y pulsa Comprobar.`},
  anzan:{t:'Anzan',i:'brain',d:'Verás números uno por uno. Imagina el soroban y lleva la cuenta en tu mente.'},
  real:{t:'Vida real',i:'shopping-cart',d:`${CFG.N_REAL} problemas del día a día.`}
};
function startRun(mode){
  const pf=pendingForm();if(pf&&mode!=='soroban'){startForm(pf);return;}
  if(mode==='soroban'&&!S.formDone[TRACK_AREA[curTrack()]]){startForm(TRACK_AREA[curTrack()]);return;}
  clearTimers();inp='';fm=null;
  const map={full:['warm','repaso','soroban','real'],warm:['warm'],repaso:['repaso'],soroban:['soroban'],anzan:['anzan'],real:['real']};
  run={mode,stages:[...map[mode],'summary'],si:-1,res:{}};
  nextStage();
}
function nextStage(){
  clearTimers();inp='';run.si++;run.stage=run.stages[run.si];run.st={};run.onSubmit=null;
  run.intro=run.stage!=='summary';
  if(run.stage==='summary'){if(!S.studyDays.includes(today()))S.studyDays.push(today());save();}
  render();
}
function beginStage(){run.intro=false;({warm:initWarm,repaso:initRepaso,soroban:initSoro,anzan:initAnzan,real:initReal})[run.stage]();render();}
function runView(){
  const total=run.stages.length-1;
  const hdr=`<div class="flex items-center justify-between mb-4"><div class="text-lg font-semibold text-slate-100">${run.stage==='summary'?'Resumen':`Paso ${run.si+1} de ${total}`}</div><button onclick="go(tab)" class="flex items-center gap-1 text-lg font-semibold bg-slate-800 rounded-xl px-3 py-2"><i data-lucide="x" class="w-5 h-5"></i>Salir</button></div>`;
  if(run.intro){const s=INFO[run.stage];return hdr+`<div class="pop rounded-3xl bg-slate-800 p-6 text-center mt-4"><i data-lucide="${s.i}" class="w-14 h-14 mx-auto text-amber-400"></i><h2 class="text-3xl font-extrabold mt-3">${s.t}</h2><p class="text-xl text-white mt-3 leading-relaxed">${run.stage==='soroban'?soroIntro():s.d}</p><button onclick="beginStage()" class="mt-6 w-full rounded-2xl bg-amber-500 text-slate-950 text-2xl font-extrabold py-4">Empezar</button></div>`;}
  return hdr+({warm:vWarm,repaso:vRepaso,soroban:vSoro,anzan:vAnzan,real:vReal,summary:vSummary})[run.stage]();
}

/* --- Calentamiento --- */
function initWarm(){
  const st=run.st;st.left=CFG.WARM_SECS;st.ok=0;st.tot=0;st.n=rnd(1,9);
  run.onSubmit=v=>{
    const good=v===10-st.n;st.tot++;if(good)st.ok++;flash(good);
    timers.push(setTimeout(()=>{let n;do{n=rnd(1,9);}while(n===st.n);st.n=n;const q=document.getElementById('wq');if(q)q.textContent=`${n} + ? = 10`;const o=document.getElementById('wok');if(o)o.textContent=st.ok;resetDisp();},200));
  };
  timers.push(setInterval(()=>{st.left--;const el=document.getElementById('wt');if(el)el.textContent=st.left;if(st.left<=0){run.res.warm={ok:st.ok,tot:st.tot};nextStage();}},1000));
}
function vWarm(){const st=run.st;return `<div class="flex justify-between items-center mb-2"><div class="flex items-center gap-2 text-3xl font-extrabold"><i data-lucide="timer" class="w-8 h-8 text-amber-400"></i><span id="wt">${st.left}</span> s</div><div class="text-3xl font-extrabold text-emerald-400">✓ <span id="wok">${st.ok}</span></div></div><div id="wq" class="text-center text-6xl font-extrabold my-8">${st.n} + ? = 10</div>${padHTML()}`;}

/* --- Repaso --- */
function initRepaso(){
  const st=run.st,ops=LEVELS[S.level-1].ops;
  const fromBank=Object.values(S.bank).filter(b=>ops.includes(b.op)).sort((x,y)=>y.w-x.w).slice(0,3).map(b=>({...b,fromBank:true}));
  const list=[...fromBank];while(list.length<CFG.N_REPASO)list.push(gen(pick(ops)));
  st.list=shuffle(list);st.i=0;st.rec=[];st.phase='q';st.helped=false;st.showHint=false;st.t0=performance.now();st.levelBefore=S.level;
  run.onSubmit=v=>{
    if(st.phase!=='q')return;
    const e=st.list[st.i],dt=(performance.now()-st.t0)/1000,right=v===e.ans,good=right&&!st.helped;
    st.rec.push({dt,good});updBank(e,good&&dt<CFG.TIME);flash(right);
    if(!right){st.phase='wrong';st.last=v;timers.push(setTimeout(render,200));return;}
    if(good&&st.i%3===2){timers.push(setTimeout(()=>{st.phase='strat';render();},250));return;}
    timers.push(setTimeout(nextQ,250));
  };
}
function showHint(){run.st.helped=true;run.st.showHint=true;render();}
function nextQ(){
  const st=run.st;st.i++;st.helped=false;st.showHint=false;st.phase='q';inp='';
  if(st.i>=st.list.length){
    const acc=st.rec.filter(r=>r.good).length/st.rec.length,avg=mean(st.rec.map(r=>r.dt));
    const ev=evaluate(acc,avg);
    S.sessions.push({date:today(),level:st.levelBefore,acc,avg,n:st.rec.length});save();
    run.res.repaso={acc,avg,...ev};nextStage();return;
  }
  st.t0=performance.now();render();
}
function chooseStrat(i){const e=run.st.list[run.st.i],n=STRATS[e.op][i];S.strategies[e.op]=S.strategies[e.op]||{};S.strategies[e.op][n]=(S.strategies[e.op][n]||0)+1;save();nextQ();}
function progBar(i,n){return `<div class="flex items-center gap-3 mb-2"><div class="flex-1 h-3 bg-slate-700 rounded-full overflow-hidden"><div class="h-full bg-amber-400" style="width:${i/n*100}%"></div></div><span class="text-lg font-bold">${i+1}/${n}</span></div>`;}
function vRepaso(){
  const st=run.st,e=st.list[st.i];
  const q=`<div class="text-center text-6xl font-extrabold my-6">${e.a} ${e.op} ${e.b}</div>${e.fromBank?'<div class="text-center text-lg font-semibold text-rose-300 -mt-3 mb-3 flex items-center justify-center gap-1"><i data-lucide="rotate-ccw" class="w-5 h-5"></i>Del banco de errores</div>':''}`;
  const top=progBar(st.i,st.list.length)+q;
  if(st.phase==='strat')return top+`<div class="pop rounded-3xl bg-slate-800 p-5"><h3 class="text-2xl font-bold mb-1">¡Correcto! ¿Cómo lo resolviste?</h3><p class="text-lg text-slate-100 mb-4">Así la app mide tu razonamiento, no solo el resultado.</p><div class="grid gap-2">${STRATS[e.op].map((s,i)=>`<button onclick="chooseStrat(${i})" class="text-left text-xl font-semibold bg-slate-700 hover:bg-slate-600 rounded-2xl px-4 py-4">${s}</button>`).join('')}</div></div>`;
  if(st.phase==='wrong')return top+`<div class="pop rounded-3xl bg-rose-950 border-2 border-rose-500 p-5 mb-3"><div class="text-2xl font-bold">Respondiste ${st.last}</div><div class="text-2xl font-bold text-emerald-300">La respuesta es ${e.ans}</div></div>${hintBox(hint(e),e)}<button onclick="nextQ()" class="w-full rounded-2xl bg-amber-500 text-slate-950 text-2xl font-extrabold py-4">Siguiente</button>`;
  return top+(st.showHint?hintBox(hint(e),e):`<button onclick="showHint()" class="w-full mb-3 rounded-2xl bg-sky-900 border-2 border-sky-500 py-3 text-xl font-bold flex items-center justify-center gap-2"><i data-lucide="lightbulb" class="w-6 h-6"></i>¿Cómo se piensa? <span class="text-base font-semibold text-sky-200">(cuenta como fallo)</span></button>`)+padHTML();
}

/* --- Soroban (retos) --- */
function initSoro(){const st=run.st,k=curTrack();st.k=k;st.L=TRACKS[k].levels[S.soro[k].lv-1];st.list=Array.from({length:CFG.N_SORO},()=>genSoro(k,st.L));st.i=0;st.rec=[];st.phase='q';st.t0=performance.now();resetRods();}
function soroIntro(){const k=curTrack(),L=TRACKS[k].levels[S.soro[k].lv-1];return `${CFG.N_SORO} retos de ${TRACKS[k].name}, nivel ${L.l}. Meta: ${CFG.PREC*100} % de aciertos y menos de ${L.t} s por reto.`;}
function soroCheck(){const st=run.st,e=st.list[st.i],v=soroVal();st.rec.push({good:v===e.ans,dt:(performance.now()-st.t0)/1000});st.last=v;st.phase=v===e.ans?'ok':'wrong';render();}
function soroNext(){const st=run.st;st.i++;if(st.i>=st.list.length){const ok=st.rec.filter(r=>r.good).length,acc=ok/st.rec.length,avg=mean(st.rec.map(r=>r.dt));run.res.soroban={ok,tot:st.rec.length,acc,avg,k:st.k,L:st.L,...evalTrack(st.k,acc,avg)};nextStage();return;}st.phase='q';resetRods();st.t0=performance.now();render();}
function vSoro(){
  const st=run.st,e=st.list[st.i];
  const verb=e.terms?'Haz cada operación en orden, de izquierda a derecha,':({'+':`Coloca el ${e.a}, suma ${e.b}`,'−':`Coloca el ${e.a}, resta ${e.b}`,'×':'Calcula y deja el resultado','÷':'Calcula y deja el resultado'}[e.op]);
  let h=`<div class="text-center text-lg font-bold mb-2" style="color:${ORANGE}">${TRACKS[st.k].name} · ${st.L.l}</div>`+progBar(st.i,st.list.length)+`<div class="text-center ${e.text.length>12?'text-4xl':'text-5xl'} font-extrabold my-3">${e.text}</div><div class="text-center text-lg text-slate-100 mb-3">${verb} en el ábaco.</div>`+soroControls()+abacusHTML();
  if(st.phase==='q')return h+`<div class="grid grid-cols-2 gap-2 mt-3"><button onclick="clearAbacus()" class="rounded-2xl bg-slate-700 py-4 text-xl font-bold">Limpiar</button><button onclick="soroCheck()" class="rounded-2xl bg-emerald-600 py-4 text-xl font-extrabold">Comprobar</button></div>`;
  if(st.phase==='ok')return h+`<div class="pop rounded-3xl bg-emerald-950 border-2 border-emerald-400 p-4 mt-3 text-2xl font-bold">¡Correcto! ${e.ans}</div><button onclick="soroNext()" class="w-full mt-3 rounded-2xl bg-amber-500 text-slate-950 text-2xl font-extrabold py-4">Siguiente</button>`;
  return h+`<div class="pop rounded-3xl bg-rose-950 border-2 border-rose-500 p-4 mt-3"><div class="text-2xl font-bold">En tu ábaco hay ${st.last}</div><div class="text-2xl font-bold text-emerald-300">La respuesta es ${e.ans}</div></div><div class="mt-3">${hintBox(soroHint(e),e)}</div><button onclick="soroNext()" class="w-full rounded-2xl bg-amber-500 text-slate-950 text-2xl font-extrabold py-4">Siguiente</button>`;
}

/* --- Anzan --- */
function initAnzan(){const st=run.st;st.round=0;st.ok=0;newAnzanRound();}
function newAnzanRound(){
  const st=run.st,sub=S.level>=2,len=rnd(3,4);let total=rnd(1,9);const seq=[{s:'',n:total}];
  for(let i=1;i<len;i++){const n=rnd(1,9);if(sub&&Math.random()<.4&&total-n>=0){seq.push({s:'−',n});total-=n;}else{seq.push({s:'+',n});total+=n;}}
  st.seq=seq;st.total=total;st.k=0;st.blank=false;st.phase='show';run.onSubmit=null;anzanTick();
}
function anzanTick(){
  const st=run.st;render();
  timers.push(setTimeout(()=>{st.k++;if(st.k>=st.seq.length){st.phase='ask';run.onSubmit=v=>{st.last=v;if(v===st.total)st.ok++;st.phase='res';render();};render();}else{st.blank=true;render();timers.push(setTimeout(()=>{st.blank=false;anzanTick();},250));}},1400));
}
function anzanNext(){const st=run.st;st.round++;if(st.round>=CFG.N_ANZAN){run.res.anzan={ok:st.ok,tot:CFG.N_ANZAN};nextStage();}else{inp='';newAnzanRound();}}
function vAnzan(){
  const st=run.st,head=`<div class="text-center text-xl font-semibold text-slate-100 mb-2">Ronda ${st.round+1} de ${CFG.N_ANZAN}</div>`;
  if(st.phase==='show'){const it=st.seq[st.k];return head+`<div class="h-72 rounded-3xl bg-violet-950 border-2 border-violet-500 flex items-center justify-center text-8xl font-black">${st.blank?'':(it.s?it.s+' ':'')+it.n}</div><div class="text-center text-lg text-slate-100 mt-4">Imagina las cuentas moviéndose…</div>`;}
  if(st.phase==='ask')return head+`<div class="text-center text-3xl font-bold my-6">¿Cuál es el total?</div>`+padHTML();
  const ok=st.last===st.total,expr=st.seq.map((x,i)=>i?`${x.s} ${x.n}`:x.n).join(' ');
  return head+`<div class="pop rounded-3xl ${ok?'bg-emerald-950 border-emerald-400':'bg-rose-950 border-rose-500'} border-2 p-5"><div class="text-2xl font-bold">${ok?'¡Correcto!':'Respondiste '+st.last}</div><div class="text-3xl font-extrabold mt-2">${expr} = <span class="text-emerald-300">${st.total}</span></div></div><button onclick="anzanNext()" class="w-full mt-3 rounded-2xl bg-amber-500 text-slate-950 text-2xl font-extrabold py-4">Siguiente</button>`;
}

/* --- Vida real --- */
function genReal(){
  const L=S.level,pool=['total'];if(L>=2)pool.push('vuelto');if(L>=3)pool.push('varios');if(L>=4)pool.push('p10','p50','p25','desc');
  switch(pick(pool)){
    case 'total':{const a=rnd(11,59),b=rnd(3,9);return {txt:`Compras un artículo de ${a} y otro de ${b}. ¿Cuánto pagas en total?`,ans:a+b,h:hint({a,b,op:'+'}),e:{a,b,op:'+'}};}
    case 'vuelto':{const c=rnd(12,88),nx=Math.ceil(c/10)*10;return {txt:`Algo cuesta ${c}. Pagas con un billete de 100. ¿Cuánto te dan de vuelto?`,ans:100-c,h:c%10?[`De ${c} a ${nx} faltan ${nx-c}.`,`De ${nx} a 100 faltan ${100-nx}.`,`Vuelto: ${nx-c} + ${100-nx} = ${100-c}`]:[`De ${c} a 100 faltan ${100-c}.`]};}
    case 'varios':{const n=rnd(3,9),p=rnd(3,9);return {txt:`Compras ${n} artículos de ${p} cada uno. ¿Cuánto pagas?`,ans:n*p,h:hint({a:n,b:p,op:'×'}),e:{a:n,b:p,op:'×'}};}
    case 'p10':{const n=rnd(2,50)*10;return {txt:`¿Cuánto es el 10 % de ${n}?`,ans:n/10,h:['10 % es dividir entre 10.',`Dividir entre 10 es quitar un cero: ${n} → ${n/10}`]};}
    case 'p50':{const n=rnd(5,60)*2;return {txt:`¿Cuánto es el 50 % de ${n}?`,ans:n/2,h:['50 % es la mitad.',`La mitad de ${n} es ${n/2}`]};}
    case 'p25':{const n=rnd(3,30)*4;return {txt:`¿Cuánto es el 25 % de ${n}?`,ans:n/4,h:['25 % es la mitad de la mitad.',`Mitad de ${n}: ${n/2}`,`Mitad de ${n/2}: ${n/4}`]};}
    default:{const n=rnd(2,30)*10;return {txt:`Un producto cuesta ${n} y tiene 10 % de descuento. ¿Cuánto pagas?`,ans:n-n/10,h:[`10 % de ${n} es ${n/10} (quitas un cero).`,`${n} − ${n/10} = ${n-n/10}`]};}
  }
}
function initReal(){
  const st=run.st;st.list=Array.from({length:CFG.N_REAL},genReal);st.i=0;st.ok=0;st.phase='q';
  run.onSubmit=v=>{if(st.phase!=='q')return;const p=st.list[st.i];flash(v===p.ans);st.last=v;if(v===p.ans){st.ok++;timers.push(setTimeout(realNext,300));}else{st.phase='wrong';timers.push(setTimeout(render,200));}};
}
function realNext(){const st=run.st;st.i++;st.phase='q';inp='';if(st.i>=st.list.length){run.res.real={ok:st.ok,tot:st.list.length};nextStage();return;}render();}
function vReal(){
  const st=run.st,p=st.list[st.i];
  const top=progBar(st.i,st.list.length)+`<div class="rounded-3xl bg-slate-800 p-5 my-3 flex gap-3"><i data-lucide="shopping-cart" class="w-8 h-8 text-amber-400 shrink-0"></i><p class="text-2xl font-semibold leading-snug">${p.txt}</p></div>`;
  if(st.phase==='wrong')return top+`<div class="pop rounded-3xl bg-rose-950 border-2 border-rose-500 p-5 mb-3"><div class="text-2xl font-bold">Respondiste ${st.last}</div><div class="text-2xl font-bold text-emerald-300">La respuesta es ${p.ans}</div></div>${hintBox(p.h,p.e)}<button onclick="realNext()" class="w-full rounded-2xl bg-amber-500 text-slate-950 text-2xl font-extrabold py-4">Siguiente</button>`;
  return top+padHTML();
}

/* --- Resumen --- */
function vSummary(){
  const r=run.res,row=(l,v,ok)=>`<div class="flex justify-between items-center text-xl py-1"><span>${l}</span><span class="font-bold ${ok===undefined?'':ok?'text-emerald-300':'text-rose-300'}">${v}${ok===undefined?'':ok?' ✓':' ✗'}</span></div>`;
  let h=`<h2 class="text-3xl font-extrabold mb-4">¡Sesión terminada!</h2>`;
  if(r.warm)h+=card(`<div class="text-xl font-bold mb-1 flex items-center gap-2"><i data-lucide="flame" class="w-6 h-6 text-orange-400"></i>Calentamiento</div>${row('Parejas acertadas',`${r.warm.ok} de ${r.warm.tot}`)}`);
  if(r.repaso){const x=r.repaso;h+=card(`<div class="text-xl font-bold mb-1 flex items-center gap-2"><i data-lucide="repeat" class="w-6 h-6 text-amber-400"></i>Repaso</div>${row('Precisión',Math.round(x.acc*100)+' %',x.acc>=CFG.PREC)}${row('Tiempo promedio',x.avg.toFixed(1)+' s',x.avg<CFG.TIME)}${x.unlocked?`<div class="pop mt-3 rounded-2xl bg-emerald-600 p-4 text-2xl font-extrabold text-center">🎉 ¡Desbloqueaste el nivel ${S.level}: ${LEVELS[S.level-1].name}!</div>`:`<div class="text-xl mt-2">${x.ok?'Cumpliste la meta.':'Esta vez no se cumplió la meta.'} Llevas <b class="text-emerald-300">${S.qualify} de ${CFG.DAYS}</b>.</div>`}`);}
  if(r.soroban){const x=r.soroban,T=TRACKS[x.k];h+=card(`<div class="text-xl font-bold mb-1 flex items-center gap-2"><i data-lucide="calculator" class="w-6 h-6 text-amber-400"></i>Soroban · ${T.name} (${x.L.l})</div>${row('Retos correctos',`${x.ok} de ${x.tot}`)}${row('Precisión',Math.round(x.acc*100)+' %',x.acc>=CFG.PREC)}${row('Tiempo promedio',x.avg.toFixed(1)+' s',x.avg<x.L.t)}${x.unlocked?`<div class="pop mt-3 rounded-2xl p-4 text-2xl font-extrabold text-center text-black" style="background:${ORANGE}">🎉 ¡Subiste a ${T.levels[S.soro[x.k].lv-1].l}!</div>`:`<div class="text-xl mt-2">${x.ok?'Cumpliste la meta.':'Esta vez no se cumplió la meta.'} Llevas <b class="text-emerald-300">${S.soro[x.k].q} de ${CFG.DAYS}</b>.</div>`}`);}
  if(r.anzan)h+=card(`<div class="text-xl font-bold mb-1 flex items-center gap-2"><i data-lucide="brain" class="w-6 h-6 text-violet-400"></i>Anzan</div>${row('Rondas correctas',`${r.anzan.ok} de ${r.anzan.tot}`)}`);
  if(r.real)h+=card(`<div class="text-xl font-bold mb-1 flex items-center gap-2"><i data-lucide="shopping-cart" class="w-6 h-6 text-amber-400"></i>Vida real</div>${row('Problemas correctos',`${r.real.ok} de ${r.real.tot}`)}`);
  return h+(pendingForm()?formGate():'')+`<button onclick="go(tab)" class="w-full rounded-2xl bg-amber-500 text-slate-950 text-2xl font-extrabold py-4">Volver</button>`;
}

render();
</script>
</body>
</html>
